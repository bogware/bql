name: CI

# Runs when asked, or when another workflow calls it. Nothing runs on a schedule, and nothing
# runs on pull requests from forks. Actions are pinned to commits and bumped by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.BQL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bql.slnx

      - name: Build
        run: dotnet build Bql.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Bql.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack Bql.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/*.nupkg
