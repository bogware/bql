name: CI

# Runs when asked, or when another workflow calls it. Nothing runs on a schedule.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.BQL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bql.slnx

      - name: Build
        run: dotnet build Bql.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Bql.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack Bql.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
